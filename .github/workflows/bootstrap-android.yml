name: Bootstrap Android and Build CLASSRUSH

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            TEMP_PROJECT="$(mktemp -d)/classrush_android"
            flutter create --platforms=android --org com.classrush --project-name app "$TEMP_PROJECT"
            cp -R "$TEMP_PROJECT/android" ./android
          fi

      - name: Configure Firebase Google Services plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          app_gradle = Path("android/app/build.gradle.kts")

          if settings.exists():
              s = settings.read_text()
              if "com.google.gms.google-services" not in s:
                  s, count = re.subn(
                      r"plugins\\s*\\{",
                      lambda m: m.group(0) + '\\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                      s, count=1
                  )
                  if count != 1:
                      raise SystemExit("Could not safely add Google Services plugin to settings.gradle.kts")
                  settings.write_text(s)
          else:
              settings = Path("android/settings.gradle")
              if not settings.exists():
                  raise SystemExit("Flutter Android settings Gradle file was not generated")
              s = settings.read_text()
              if "com.google.gms.google-services" not in s:
                  s, count = re.subn(
                      r"plugins\\s*\\{",
                      lambda m: m.group(0) + "\\n    id 'com.google.gms.google-services' version '4.4.4' apply false",
                      s, count=1
                  )
                  if count != 1:
                      raise SystemExit("Could not safely add Google Services plugin to settings.gradle")
                  settings.write_text(s)

          if app_gradle.exists():
              s = app_gradle.read_text()
              if 'id("com.google.gms.google-services")' not in s:
                  s, count = re.subn(
                      r"plugins\\s*\\{",
                      lambda m: m.group(0) + '\\n    id("com.google.gms.google-services")',
                      s, count=1
                  )
                  if count != 1:
                      raise SystemExit("Could not safely apply Google Services plugin in app build.gradle.kts")
                  app_gradle.write_text(s)
              if 'applicationId = "com.classrush.app"' not in s:
                  s, count = re.subn(
                      r'applicationId\\s*=\\s*"[^"]+"',
                      'applicationId = "com.classrush.app"', s, count=1
                  )
                  if count != 1:
                      raise SystemExit("Could not set Android applicationId in app build.gradle.kts")
                  app_gradle.write_text(s)
          else:
              app_gradle = Path("android/app/build.gradle")
              if not app_gradle.exists():
                  raise SystemExit("Flutter app Gradle file was not generated")
              s = app_gradle.read_text()
              if "com.google.gms.google-services" not in s:
                  s, count = re.subn(
                      r"plugins\\s*\\{",
                      lambda m: m.group(0) + "\\n    id 'com.google.gms.google-services'",
                      s, count=1
                  )
                  if count != 1:
                      raise SystemExit("Could not safely apply Google Services plugin in app build.gradle")
                  s = s
              s, count = re.subn(
                  r"applicationId\\s+['\"][^'\"]+['\"]",
                  "applicationId 'com.classrush.app'", s, count=1
              )
              if count != 1:
                  raise SystemExit("Could not set Android applicationId in app build.gradle")
              app_gradle.write_text(s)
          PY

      - name: Verify Firebase Android configuration
        run: |
          test -f android/app/google-services.json
          grep -q '"package_name": "com.classrush.app"' android/app/google-services.json

      - name: Commit generated Android platform files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if ! git diff --cached --quiet; then
            git commit -m "Generate Android platform and configure Firebase"
            git push
          else
            echo "Android platform files are already committed."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Commit generated Android platform files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if ! git diff --cached --quiet; then
            git commit -m "Generate Android platform and configure Firebase"
            git push
          else
            echo "Android platform files are already committed."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: classrush-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
