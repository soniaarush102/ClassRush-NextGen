name: Bootstrap Android and Build CLASSRUSH

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            TEMP_PROJECT="$(mktemp -d)/classrush_android"
            flutter create --platforms=android --org com.classrush --project-name app "$TEMP_PROJECT"
            mkdir -p android
            cp -R "$TEMP_PROJECT/android/." ./android/
          fi

      - name: Configure Firebase Google Services plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          settings_kts = Path("android/settings.gradle.kts")
          settings_groovy = Path("android/settings.gradle")
          app_kts = Path("android/app/build.gradle.kts")
          app_groovy = Path("android/app/build.gradle")

          if settings_kts.exists():
              content = settings_kts.read_text()
              if "com.google.gms.google-services" not in content:
                  content = content.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                      1
                  )
                  settings_kts.write_text(content)
          elif settings_groovy.exists():
              content = settings_groovy.read_text()
              if "com.google.gms.google-services" not in content:
                  content = content.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services' version '4.4.4' apply false",
                      1
                  )
                  settings_groovy.write_text(content)
          else:
              raise SystemExit("Android settings Gradle file was not generated")

          if app_kts.exists():
              content = app_kts.read_text()
              if "com.google.gms.google-services" not in content:
                  content = content.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services")',
                      1
                  )
              if 'applicationId = "com.classrush.app"' not in content:
                  raise SystemExit("Generated Android applicationId is not com.classrush.app")
              app_kts.write_text(content)
          elif app_groovy.exists():
              content = app_groovy.read_text()
              if "com.google.gms.google-services" not in content:
                  content = content.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1
                  )
              if "applicationId 'com.classrush.app'" not in content and 'applicationId "com.classrush.app"' not in content:
                  raise SystemExit("Generated Android applicationId is not com.classrush.app")
              app_groovy.write_text(content)
          else:
              raise SystemExit("Android app Gradle file was not generated")
          PY

      - name: Verify Firebase Android configuration
        run: |
          test -f android/app/google-services.json
          grep -q '"package_name": "com.classrush.app"' android/app/google-services.json

      - name: Commit generated Android platform files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if ! git diff --cached --quiet; then
            git commit -m "Generate Android platform and configure Firebase"
            git push
          else
            echo "Android platform files are already committed."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: classrush-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
